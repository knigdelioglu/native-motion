name: Swift Package CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Swift build and test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift on Linux
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Toolchain
        run: swift --version
      - name: Test (including design-token goldens)
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Capture native SwiftUI visual audit
        if: runner.os == 'macOS'
        run: swift run -c release NativeMotionVisualAudit artifacts/visual
      - name: Measure value-model performance (diagnostic, no speed threshold)
        run: |
          mkdir -p artifacts
          swift run -c release NativeMotionBenchmark --iterations 100000 > artifacts/benchmark.json
          cat artifacts/benchmark.json
      - name: Upload macOS visual audit and benchmark
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-motion-macos-quality
          path: artifacts/
          if-no-files-found: warn
      - name: Upload Linux benchmark
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-motion-linux-benchmark
          path: artifacts/benchmark.json
          if-no-files-found: warn
